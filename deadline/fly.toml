# Fly.io deployment for the DEADLINE game server.
#   fly launch --no-deploy && fly deploy
#
# WebSockets need a machine that stays up: min_machines_running = 1 and
# auto_stop_machines = false, otherwise an idle raid room is killed mid-match.
app = "deadline-game-server"
primary_region = "fra"

[build]
  dockerfile = "apps/game-server/Dockerfile"

[env]
  NODE_ENV = "production"
  GAME_SERVER_PORT = "2567"
  ALLOW_DEMO_AUTH = "false"
  ENABLE_DEBUG_TOOLS = "false"

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

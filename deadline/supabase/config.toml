# Minimal Supabase CLI project configuration.
# `supabase start` brings up a local stack; `supabase db reset` applies
# migrations from ./migrations and then ./seed/seed.sql.
project_id = "deadline"

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed/catalog.sql"]

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1,
               user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12161d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description"
      content="Dörtyol — free-roam driving and deliveries in a low-poly city.">
<title>Dörtyol</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>

<canvas id="view"></canvas>
<div id="surface"></div>

<!-- ------------------------------------------------------------------ HUD -->
<div id="hud">
  <div class="hud__row hud__row--top">
    <div class="chip chip--score is-hidden" id="chip-score">
      <span class="chip__label" data-i18n="hud.score">SKOR</span>
      <strong id="hud-score">0</strong>
    </div>
    <div class="chip chip--target" id="chip-target">
      <span class="chip__label">🎯</span>
      <strong id="hud-target">0</strong><span class="chip__unit">m</span>
      <span id="hud-timer" class="chip__timer">--</span>
    </div>
    <div class="chip chip--coins">
      <span class="chip__label">🪙</span>
      <strong id="hud-coins">0</strong>
    </div>
    <button id="btn-pause" class="icon-button" type="button"
            data-i18n-aria="hud.pause" aria-label="Duraklat">⏸</button>
  </div>

  <div class="hud__speed">
    <strong id="hud-speed">0</strong><span data-i18n="hud.speedUnit">km/sa</span>
    <div class="hud__distance"><span id="hud-distance">0</span> m</div>
  </div>

  <canvas id="minimap" class="minimap" width="216" height="216"
          data-i18n-aria="hud.map" aria-label="Harita"></canvas>

  <div class="hud__nitro">
    <div class="hud__nitro-track">
      <div id="hud-nitro-fill" class="hud__nitro-fill"></div>
    </div>
    <span class="hud__nitro-label" data-i18n="hud.nitro">NITRO</span>
  </div>
</div>

<div id="target-arrow" class="target-arrow" aria-hidden="true">
  <svg viewBox="0 0 24 24" width="26" height="26">
    <path d="M12 2 L21 21 L12 16 L3 21 Z" fill="currentColor"/>
  </svg>
</div>

<div id="toast"></div>

<div id="tutorial" class="tutorial">
  <p id="tutorial-text"></p>
  <button id="btn-tutorial" class="button button--primary" type="button"
          data-i18n="tutorial.gotIt">ANLADIM</button>
</div>

<!-- ------------------------------------------------------------- controls -->
<div id="controls">
  <div class="control-cluster control-cluster--left">
    <button id="btn-left" class="control control--steer" type="button"
            data-i18n-aria="control.left" aria-label="Sola">◀</button>
    <button id="btn-right" class="control control--steer" type="button"
            data-i18n-aria="control.right" aria-label="Sağa">▶</button>
  </div>
  <div class="control-cluster control-cluster--right">
    <button id="btn-nitro" class="control control--nitro" type="button"
            data-i18n-aria="control.nitro" aria-label="Nitro">N<small>ITRO</small></button>
    <div class="control-row">
      <button id="btn-brake" class="control control--brake" type="button"
              data-i18n-aria="control.brake" aria-label="Fren ve geri">
        <span data-i18n="control.brakeLabel">FREN</span>
      </button>
      <button id="btn-gas" class="control control--gas" type="button"
              data-i18n-aria="control.gas" aria-label="Gaz">
        <span data-i18n="control.gasLabel">GAZ</span>
      </button>
    </div>
  </div>
</div>

<!-- -------------------------------------------------------------- screens -->
<section id="screen-loading" class="screen is-visible">
  <div class="panel panel--loading">
    <h1 class="logo">DÖRTYOL<span data-i18n="app.tagline">Şehir Sürüşü</span></h1>
    <div class="loading-track"><div id="loading-bar"></div></div>
    <p id="loading-label" class="muted" data-i18n="loading.preparing">Hazırlanıyor…</p>
  </div>
</section>

<section id="screen-menu" class="screen">
  <div class="panel">
    <h1 class="logo">DÖRTYOL<span data-i18n="app.tagline">Şehir Sürüşü</span></h1>
    <div class="stat-row">
      <div><span class="muted" data-i18n="menu.best">EN İYİ</span>
        <strong id="menu-best">0</strong></div>
      <div><span class="muted" data-i18n="menu.coins">JETON</span>
        <strong id="menu-coins">0</strong></div>
    </div>
    <button id="btn-play-city" class="button button--primary" type="button">
      <span data-i18n="menu.freeRoam">SERBEST SÜRÜŞ</span>
      <small data-i18n="menu.freeRoamHint">şehirde istediğin gibi gez</small>
    </button>
    <button id="btn-play-highway" class="button" type="button">
      <span data-i18n="menu.rush">TRAFİK YARIŞI</span>
      <small data-i18n="menu.rushHint">sonsuz otoyol, skor avı</small>
    </button>
    <div class="button-row">
      <button id="btn-garage" class="button" type="button"
              data-i18n="menu.garage">GARAJ</button>
      <button id="btn-settings" class="button button--ghost" type="button"
              data-i18n="menu.settings">AYARLAR</button>
    </div>
    <p class="hint" data-i18n="menu.controlsHint"></p>
  </div>
</section>

<section id="screen-garage" class="screen">
  <div class="panel panel--wide">
    <header class="panel__head">
      <h2 data-i18n="garage.title">GARAJ</h2>
      <div class="chip"><span class="chip__label">🪙</span>
        <strong id="garage-coins">0</strong></div>
    </header>
    <div class="garage-scroll">
      <div id="garage-list" class="garage-list"></div>
      <div id="garage-tune" class="tune"></div>
    </div>
    <button id="btn-garage-back" class="button button--ghost" type="button"
            data-i18n="garage.back">GERİ</button>
  </div>
</section>

<section id="screen-settings" class="screen">
  <div class="panel">
    <h2 data-i18n="settings.title">AYARLAR</h2>
    <div class="settings-scroll">
      <div class="lang">
        <span class="lang__label" data-i18n="settings.language">Dil</span>
        <div id="lang-options" class="lang__options"></div>
      </div>
      <label class="switch">
        <input id="toggle-sound" type="checkbox" checked>
        <span data-i18n="settings.sound">Ses</span>
      </label>
      <label class="switch">
        <input id="toggle-music" type="checkbox" checked>
        <span data-i18n="settings.music">Müzik</span>
      </label>
      <label class="switch">
        <input id="toggle-vibrate" type="checkbox" checked>
        <span data-i18n="settings.vibrate">Titreşim</span>
      </label>
      <label class="switch">
        <input id="toggle-throttle" type="checkbox">
        <span data-i18n="settings.autoThrottle">Otomatik gaz</span>
      </label>
      <label class="switch">
        <input id="toggle-tilt" type="checkbox">
        <span data-i18n="settings.tilt">Eğerek sür (jiroskop)</span>
      </label>
      <label class="switch">
        <input id="toggle-shadows" type="checkbox" checked>
        <span data-i18n="settings.shadows">Gölgeler</span>
      </label>
      <label class="switch">
        <input id="toggle-lefthanded" type="checkbox">
        <span data-i18n="settings.leftHanded">Solak düzeni</span>
      </label>
    </div>
    <button id="btn-settings-back" class="button button--ghost" type="button"
            data-i18n="settings.back">GERİ</button>
  </div>
</section>

<section id="screen-paused" class="screen">
  <div class="panel">
    <h2 data-i18n="pause.title">DURAKLATILDI</h2>
    <button id="btn-resume" class="button button--primary" type="button"
            data-i18n="pause.resume">DEVAM ET</button>
    <button id="btn-quit" class="button button--ghost" type="button"
            data-i18n="pause.menu">ANA MENÜ</button>
  </div>
</section>

<section id="screen-over" class="screen">
  <div class="panel">
    <h2 id="over-banner" data-i18n="over.crashed">ÇARPTIN!</h2>
    <dl class="result">
      <div><dt data-i18n="over.score">Skor</dt><dd id="over-score">0</dd></div>
      <div><dt data-i18n="over.distance">Mesafe</dt><dd id="over-distance">0 m</dd></div>
      <div><dt data-i18n="over.coins">Jeton</dt><dd id="over-coins">0</dd></div>
      <div><dt data-i18n="over.best">En iyi</dt><dd id="over-best">0</dd></div>
    </dl>
    <button id="btn-retry" class="button button--primary" type="button"
            data-i18n="over.retry">TEKRAR</button>
    <button id="btn-over-menu" class="button button--ghost" type="button"
            data-i18n="over.menu">ANA MENÜ</button>
  </div>
</section>

<script type="module" src="js/main.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {
        /* offline play is a bonus, not a requirement */
      });
    });
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1,
               user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12161d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Asfalt Fırtınası — telefon için 3B trafik yarışı.">
<title>Asfalt Fırtınası</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>

<canvas id="view"></canvas>
<div id="surface"></div>

<!-- ------------------------------------------------------------------ HUD -->
<div id="hud">
  <div class="hud__row hud__row--top">
    <div class="chip chip--score">
      <span class="chip__label">SKOR</span>
      <strong id="hud-score">0</strong>
    </div>
    <div class="chip chip--coins">
      <span class="chip__label">🪙</span>
      <strong id="hud-coins">0</strong>
    </div>
    <button id="btn-pause" class="icon-button" type="button"
            aria-label="Duraklat">⏸</button>
  </div>

  <div class="hud__speed">
    <strong id="hud-speed">0</strong><span>km/s</span>
    <div class="hud__distance"><span id="hud-distance">0</span> m</div>
  </div>

  <div class="hud__nitro">
    <div class="hud__nitro-track">
      <div id="hud-nitro-fill" class="hud__nitro-fill"></div>
    </div>
    <span class="hud__nitro-label">NITRO</span>
  </div>
</div>

<div id="toast"></div>

<!-- ------------------------------------------------------------- controls -->
<div id="controls">
  <div class="control-cluster control-cluster--left">
    <button id="btn-left" class="control control--steer" type="button"
            aria-label="Sola">◀</button>
    <button id="btn-right" class="control control--steer" type="button"
            aria-label="Sağa">▶</button>
  </div>
  <div class="control-cluster control-cluster--right">
    <button id="btn-nitro" class="control control--nitro" type="button"
            aria-label="Nitro">N<small>ITRO</small></button>
    <div class="control-row">
      <button id="btn-brake" class="control control--brake" type="button"
              aria-label="Fren">FREN</button>
      <button id="btn-gas" class="control control--gas is-hidden" type="button"
              aria-label="Gaz">GAZ</button>
    </div>
  </div>
</div>

<!-- -------------------------------------------------------------- screens -->
<section id="screen-loading" class="screen is-visible">
  <div class="panel panel--loading">
    <h1 class="logo">ASFALT<span>FIRTINASI</span></h1>
    <div class="loading-track"><div id="loading-bar"></div></div>
    <p id="loading-label" class="muted">Hazırlanıyor…</p>
  </div>
</section>

<section id="screen-menu" class="screen">
  <div class="panel">
    <h1 class="logo">ASFALT<span>FIRTINASI</span></h1>
    <div class="stat-row">
      <div><span class="muted">EN İYİ</span><strong id="menu-best">0</strong></div>
      <div><span class="muted">JETON</span><strong id="menu-coins">0</strong></div>
    </div>
    <button id="btn-play" class="button button--primary" type="button">OYNA</button>
    <button id="btn-garage" class="button" type="button">GARAJ</button>
    <button id="btn-settings" class="button button--ghost" type="button">AYARLAR</button>
    <p class="hint">Direksiyon: ok tuşları ya da ekranı kaydır · Nitro: N</p>
  </div>
</section>

<section id="screen-garage" class="screen">
  <div class="panel panel--wide">
    <header class="panel__head">
      <h2>GARAJ</h2>
      <div class="chip"><span class="chip__label">🪙</span>
        <strong id="garage-coins">0</strong></div>
    </header>
    <div id="garage-list" class="garage-list"></div>
    <button id="btn-garage-back" class="button button--ghost" type="button">GERİ</button>
  </div>
</section>

<section id="screen-settings" class="screen">
  <div class="panel">
    <h2>AYARLAR</h2>
    <label class="switch">
      <input id="toggle-sound" type="checkbox" checked>
      <span>Ses</span>
    </label>
    <label class="switch">
      <input id="toggle-throttle" type="checkbox" checked>
      <span>Otomatik gaz</span>
    </label>
    <label class="switch">
      <input id="toggle-tilt" type="checkbox">
      <span>Eğerek sür (jiroskop)</span>
    </label>
    <button id="btn-settings-back" class="button button--ghost" type="button">GERİ</button>
  </div>
</section>

<section id="screen-paused" class="screen">
  <div class="panel">
    <h2>DURAKLATILDI</h2>
    <button id="btn-resume" class="button button--primary" type="button">DEVAM ET</button>
    <button id="btn-quit" class="button button--ghost" type="button">ANA MENÜ</button>
  </div>
</section>

<section id="screen-over" class="screen">
  <div class="panel">
    <h2 id="over-banner">ÇARPTIN!</h2>
    <dl class="result">
      <div><dt>Skor</dt><dd id="over-score">0</dd></div>
      <div><dt>Mesafe</dt><dd id="over-distance">0 m</dd></div>
      <div><dt>Jeton</dt><dd id="over-coins">0</dd></div>
      <div><dt>En iyi</dt><dd id="over-best">0</dd></div>
    </dl>
    <button id="btn-retry" class="button button--primary" type="button">TEKRAR</button>
    <button id="btn-over-menu" class="button button--ghost" type="button">ANA MENÜ</button>
  </div>
</section>

<script type="module" src="js/main.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {
        /* offline play is a bonus, not a requirement */
      });
    });
  }
</script>
</body>
</html>
